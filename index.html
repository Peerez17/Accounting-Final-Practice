const bInt=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const bPick=(r,a)=>a[bInt(r,0,a.length-1)];
const bMoney=n=>'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const bNum=(id,label,answer,unit,explain)=>({id,label,answer,unit:unit||'dollars',explain,tolerance:unit==='units'?0:0.011});
const bChoice=(id,label,answer,choices,explain)=>({id,label,answer,choices,explain});
const bTable=(title,rows,headers=['Item','Amount'])=>({title,headers,rows});
const bProb=(intro,facts,fields,hints,solution='Use the shown formulas with the data in this scenario. Round final decimals to two places; carry unrounded intermediate values.')=>({intro,facts,fields,hints,solution});
const bAccounts=['Materials','Work in Process','Finished Goods','Manufacturing Overhead','Wages Payable','Accounts Payable','Accounts Receivable','Cash','Sales','Cost of Goods Sold','Accumulated Depreciation'];
const bJournal=(intro,facts,expected,explain,hints)=>({intro,facts,fields:[],hints,solution:explain,journal:{rows:expected.length,accounts:bAccounts,expected,explain}});
const BANK=[];
function bAdd(id,ch,topic,title,type,difficulty,source,generate,optional=false){BANK.push({id,ch,topic,title,type,difficulty,source,generate,optional});}
const bS14='Warren_FinMan_17e_PPT_CH14_Final.pptx';
const bS15='Ch15 Student.pptx';
const bS16='Chapter_16_Student_Discussion_Guide1.docx';

const bS22='Warren_FinMan_17e_PPT_CH22_LO1_2_3_4 student.pptx';

bAdd('14-horizontal',14,'Analytical methods','Track changes across years','Calculation','Foundation',bS14+' • slides 7–10',r=>{
 const old=bInt(r,20,70)*1000,change=bInt(r,-9,20)*1000,now=old+change;
 return bProb('Orion Supply compares this year’s sales with last year. Use last year as the base; a decrease must be negative.',[bTable('Net sales',[['Last year',bMoney(old)],['This year',bMoney(now)]])],[bNum('change','Dollar change',change,'dollars',`${bMoney(now)} − ${bMoney(old)} = ${bMoney(change)}.`),bNum('pct','Percentage change',change/old*100,'%',`${change} ÷ ${old} × 100 = ${(change/old*100).toFixed(2)}%.`)],['Find the change before computing the percentage.','(Current − prior) ÷ prior × 100.']);
});
bAdd('14-vertical',14,'Analytical methods','Build common-size percentages','Statement','Foundation',bS14+' • slides 11–15',r=>{
 const sales=bInt(r,30,80)*10000,cogs=sales*bInt(r,45,68)/100,opex=sales*bInt(r,12,24)/100;
 return bProb('Express each income statement item as a percentage of sales. There are no other revenues or expenses.',[bTable('Income statement',[['Sales',bMoney(sales)],['Cost of goods sold',bMoney(cogs)],['Operating expenses',bMoney(opex)]])],[bNum('cogs','Cost of goods sold / sales',cogs/sales*100,'%',`${cogs} ÷ ${sales} × 100 = ${cogs/sales*100}%.`),bNum('gp','Gross profit / sales',(sales-cogs)/sales*100,'%',`(${sales} − ${cogs}) ÷ ${sales} × 100.`),bNum('oi','Operating income / sales',(sales-cogs-opex)/sales*100,'%',`(${sales} − ${cogs} − ${opex}) ÷ ${sales} × 100.`)],['Every line shares the same denominator.','Income statement base = sales; balance sheet base = total assets.']);
});
bAdd('14-liquidity',14,'Liquidity','Working capital and quick assets','Calculation','Foundation',bS14+' • slides 20–26',r=>{
 const cash=bInt(r,3,8)*10000,inv=bInt(r,6,12)*10000,ar=bInt(r,5,9)*10000,temp=bInt(r,1,3)*10000,pre=bInt(r,1,4)*1000,cl=bInt(r,7,13)*10000,ca=cash+inv+ar+temp+pre,quick=cash+temp+ar;
 return bProb('Evaluate current liquidity. Enter ratios as multiples, not percentages.',[bTable('Current balances',[['Cash',bMoney(cash)],['Temporary investments',bMoney(temp)],['Net receivables',bMoney(ar)],['Inventory',bMoney(inv)],['Prepaids',bMoney(pre)],['Current liabilities',bMoney(cl)]])],[bNum('wc','Working capital',ca-cl,'dollars',`${ca} current assets − ${cl} current liabilities.`),bNum('current','Current ratio',ca/cl,'times',`${ca} ÷ ${cl} = ${(ca/cl).toFixed(2)} times.`),bNum('quick','Quick ratio',quick/cl,'times',`(${cash} + ${temp} + ${ar}) ÷ ${cl}. Inventory and prepaids are excluded.`)],['Quick assets exclude inventory and prepaid expenses.','Working capital = CA − CL; current ratio = CA/CL; quick ratio = quick assets/CL.']);
});
bAdd('14-receivables',14,'Liquidity','Receivables turnover and days','Calculation','Exam',bS14+' • slides 27–31',r=>{
 const start=bInt(r,6,15)*10000,end=bInt(r,6,15)*10000,avg=(start+end)/2,sales=avg*bInt(r,6,15);
 return bProb('Analyze receivables using a 365-day year and average receivables. All sales are on account.',[bTable('Annual activity',[['Sales',bMoney(sales)],['Beginning net receivables',bMoney(start)],['Ending net receivables',bMoney(end)]])],[bNum('avg','Average net receivables',avg,'dollars',`(${start} + ${end}) ÷ 2 = ${avg}.`),bNum('turn','Receivables turnover',sales/avg,'times',`${sales} ÷ ${avg} = ${sales/avg}.`),bNum('days','Days’ sales in receivables',avg/(sales/365),'days',`${avg} ÷ (${sales} ÷ 365) = ${(avg/(sales/365)).toFixed(2)} days.`)],['Use the average of beginning and ending balances.','Turnover = sales / average AR; days = average AR / (sales/365).']);
});
bAdd('14-inventory',14,'Liquidity','Inventory turnover and days','Calculation','Exam',bS14+' • slides 32–36',r=>{
 const start=bInt(r,10,24)*10000,end=bInt(r,12,25)*10000,avg=(start+end)/2,cogs=avg*bInt(r,3,7);
 return bProb('Analyze inventory efficiency using a 365-day year.',[bTable('Annual activity',[['Cost of goods sold',bMoney(cogs)],['Beginning inventory',bMoney(start)],['Ending inventory',bMoney(end)]])],[bNum('turn','Inventory turnover',cogs/avg,'times',`${cogs} ÷ ((${start} + ${end}) ÷ 2) = ${cogs/avg}.`),bNum('days','Days’ sales in inventory',avg/(cogs/365),'days',`${avg} ÷ (${cogs} ÷ 365) = ${(avg/(cogs/365)).toFixed(2)} days.`)],['Inventory is carried at cost, so use cost of goods sold.','Turnover = COGS/average inventory; days = 365/turnover.']);
});

/* Chapter 13: original transaction-derived indirect-method practice.
 * Reference: Chapter_13_Cash_Flow_Review.docx, Part 1, and its Instructor Key.
 * Amounts are whole dollars. rng is supplied by the application for reproducibility.
 */
function makeCashflow(rng) {
  const pick = (lo, hi, step = 1000) => (lo + Math.floor(rng() * (hi - lo + 1))) * step;
  const money = n => n < 0 ? '(' + Math.abs(n).toLocaleString('en-US') + ')' : n.toLocaleString('en-US');
  const signed = n => (n < 0 ? '− ' : '+ ') + '$' + money(Math.abs(n));
  const check = (ok, label) => { if (!ok) throw new Error('Cash-flow integrity check failed: ' + label); };
  let scenario;
  for (let attempt = 0; attempt < 100; attempt++) {
    // Build the opening ledger from actual historical transactions. No cash or
    // equity balancing plug is used. Historical profit is closed to RE.
    const h = {
      stock: pick(490, 560), debt: pick(180, 220), equipment: pick(430, 490),
      depreciation: pick(100, 130), revenue: pick(820, 900), receivables: pick(80, 110),
      inventoryPurchases: pick(520, 580), supplierPayable: pick(60, 85),
      cogs: pick(400, 450), salaries: pick(130, 155), salariesPayable: pick(12, 22),
      insurancePurchased: pick(22, 30), insuranceExpired: pick(12, 18), other: pick(65, 85)
    };
    const opening = {
      cash: h.stock + h.debt - h.equipment + h.revenue - h.receivables
        - h.inventoryPurchases + h.supplierPayable - h.salaries + h.salariesPayable
        - h.insurancePurchased - h.other,
      ar: h.receivables, inventory: h.inventoryPurchases - h.cogs,
      prepaid: h.insurancePurchased - h.insuranceExpired, equipment: h.equipment,
      accumDep: h.depreciation, ap: h.supplierPayable, salariesPayable: h.salariesPayable,
      debt: h.debt, stock: h.stock,
      retained: h.revenue - h.cogs - h.salaries - h.insuranceExpired - h.other - h.depreciation
    };
    const t = {
      sales: pick(900, 1200), cogs: pick(470, 620), salaries: pick(145, 185),
      insurance: pick(18, 28), otherOperating: pick(45, 75), depreciation: pick(32, 55),
      interest: pick(15, 28), taxes: pick(10, 24),
      deltaAR: pick(-25, 30), deltaInventory: pick(-25, 30), deltaPrepaid: pick(-4, 6),
      deltaAP: pick(-16, 20), deltaSalaries: pick(-6, 8),
      equipmentSoldCost: pick(60, 100), equipmentBought: pick(100, 250),
      borrowing: pick(30, 100), principalRepaid: pick(35, 110),
      stockIssued: pick(0, 10, 10000), dividends: pick(20, 65)
    };
    t.soldAccumDep = Math.floor(t.equipmentSoldCost / 1000 * (0.45 + rng() * 0.3)) * 1000;
    t.bookValue = t.equipmentSoldCost - t.soldAccumDep;
    t.gain = pick(3, 14) * (rng() < 0.5 ? -1 : 1);
    t.saleProceeds = t.bookValue + t.gain;
    t.operatingExpenses = t.salaries + t.insurance + t.otherOperating + t.depreciation;
    t.netIncome = t.sales - t.cogs - t.operatingExpenses + t.gain - t.interest - t.taxes;
    // Current-year cash is posted from cash receipts and payments, independently
    // of the indirect-method solution, providing a separate cross-check.
    t.collections = t.sales - t.deltaAR;
    t.inventoryPurchases = t.cogs + t.deltaInventory;
    t.supplierPayments = t.inventoryPurchases - t.deltaAP;
    t.salaryPayments = t.salaries - t.deltaSalaries;
    t.insurancePayments = t.insurance + t.deltaPrepaid;
    const directOperating = t.collections - t.supplierPayments - t.salaryPayments
      - t.insurancePayments - t.otherOperating - t.interest - t.taxes;
    const operating = t.netIncome + t.depreciation - t.gain - t.deltaAR
      - t.deltaInventory - t.deltaPrepaid + t.deltaAP + t.deltaSalaries;
    const investing = t.saleProceeds - t.equipmentBought;
    const financing = t.stockIssued + t.borrowing - t.principalRepaid - t.dividends;
    const change = operating + investing + financing;
    const ending = {
      cash: opening.cash + directOperating + t.saleProceeds - t.equipmentBought
        + t.stockIssued + t.borrowing - t.principalRepaid - t.dividends,
      ar: opening.ar + t.deltaAR, inventory: opening.inventory + t.deltaInventory,
      prepaid: opening.prepaid + t.deltaPrepaid,
      equipment: opening.equipment + t.equipmentBought - t.equipmentSoldCost,
      accumDep: opening.accumDep + t.depreciation - t.soldAccumDep,
      ap: opening.ap + t.deltaAP, salariesPayable: opening.salariesPayable + t.deltaSalaries,
      debt: opening.debt + t.borrowing - t.principalRepaid,
      stock: opening.stock + t.stockIssued, retained: opening.retained + t.netIncome - t.dividends
    };
    const assets = b => b.cash + b.ar + b.inventory + b.prepaid + b.equipment - b.accumDep;
    const funding = b => b.ap + b.salariesPayable + b.debt + b.stock + b.retained;
    if (opening.cash < 50000 || ending.cash < 15000 || t.netIncome <= 0) continue;
    check(assets(opening) === funding(opening), 'opening balance sheet');
    check(assets(ending) === funding(ending), 'ending balance sheet');
    check(operating === directOperating, 'indirect versus direct operating cash');
    check(opening.cash + change === ending.cash, 'cash reconciliation');
    check(ending.prepaid >= 0 && ending.accumDep >= 0 && ending.accumDep < ending.equipment, 'asset balances');
    scenario = {opening, ending, t, h, operating, investing, financing, change,
      directOperating, openingAssets: assets(opening), endingAssets: assets(ending),
      openingFunding: funding(opening), endingFunding: funding(ending)};
    break;
  }
  if (!scenario) throw new Error('Unable to generate a valid cash-flow scenario.');
  const s = scenario, o = s.opening, e = s.ending, t = s.t;
  const names = ['Northstar Cycle Company', 'Cedar Trail Outfitters', 'Harbor Workshop Corporation', 'Juniper Equipment Company', 'Copper Ridge Supply'];
  const company = names[Math.floor(rng() * names.length)];
  const fields = [];
  const field = (id, label, answer, section, explain) => fields.push({id: 'cf_' + id, label, answer, unit: '$', section, explain, tolerance: 0.005});
  field('income', 'Net income', t.netIncome, 'Operating', `Start with the income statement's net income of $${money(t.netIncome)}.`);
  field('dep', 'Depreciation adjustment', t.depreciation, 'Operating', `Add back $${money(t.depreciation)}: depreciation reduced net income without a current cash payment.`);
  field('gain', (t.gain >= 0 ? 'Gain' : 'Loss') + ' on equipment sale adjustment', -t.gain, 'Operating', `${t.gain >= 0 ? 'Subtract the gain' : 'Add the loss'} of $${money(Math.abs(t.gain))}; the full $${money(t.saleProceeds)} proceeds belong in investing activities.`);
  const working = [
    ['ar', 'Accounts Receivable', t.deltaAR, -t.deltaAR, o.ar, e.ar, 'asset'],
    ['inv', 'Inventory', t.deltaInventory, -t.deltaInventory, o.inventory, e.inventory, 'asset'],
    ['prepaid', 'Prepaid Insurance', t.deltaPrepaid, -t.deltaPrepaid, o.prepaid, e.prepaid, 'asset'],
    ['ap', 'Accounts Payable', t.deltaAP, t.deltaAP, o.ap, e.ap, 'liability'],
    ['salary', 'Accrued Salaries Payable', t.deltaSalaries, t.deltaSalaries, o.salariesPayable, e.salariesPayable, 'liability']
  ];
  for (const [id, label, delta, adj, begin, end, kind] of working) {
    const movement = delta === 0 ? 'No change' : delta > 0 ? 'Increase' : 'Decrease';
    const action = adj === 0 ? 'No adjustment is needed' : adj > 0 ? 'Add this change' : 'Subtract this change';
    field(id, label + ' adjustment', adj, 'Operating', `${label}: $${money(end)} − $${money(begin)} = ${delta < 0 ? '−' : ''}$${money(Math.abs(delta))}. ${movement} in an operating ${kind}. ${action}; operating assets move opposite to their change, while operating liabilities move with their change.`);
  }
  field('cfo', 'Net cash from operating activities', s.operating, 'Operating', `$${money(t.netIncome)} ${signed(t.depreciation)} ${signed(-t.gain)} ${signed(-t.deltaAR)} ${signed(-t.deltaInventory)} ${signed(-t.deltaPrepaid)} ${signed(t.deltaAP)} ${signed(t.deltaSalaries)} = $${money(s.operating)}.`);
  field('sale', 'Cash proceeds from equipment sale', t.saleProceeds, 'Investing', `Report the entire $${money(t.saleProceeds)} cash receipt, not the gain or book value.`);
  field('purchase', 'Cash paid for equipment', -t.equipmentBought, 'Investing', `Equipment purchased for cash is an investing outflow: ($${money(t.equipmentBought)}). Enter a negative amount.`);
  field('cfi', 'Net cash from investing activities', s.investing, 'Investing', `$${money(t.saleProceeds)} − $${money(t.equipmentBought)} = $${money(s.investing)}.`);
  field('stock', 'Cash from issuing common stock', t.stockIssued, 'Financing', `The company received $${money(t.stockIssued)} from owners. A zero amount is a valid answer when no stock was issued.`);
  field('borrow', 'Cash from long-term borrowing', t.borrowing, 'Financing', `Report $${money(t.borrowing)} as a financing inflow; do not net it against principal repayments in this row.`);
  field('repay', 'Cash paid to repay note principal', -t.principalRepaid, 'Financing', `Principal paid is a financing outflow of ($${money(t.principalRepaid)}). Interest is already included in operating activities through net income.`);
  field('dividends', 'Cash dividends paid', -t.dividends, 'Financing', `Cash dividends are financing outflows: ($${money(t.dividends)}). They do not reduce net income.`);
  field('cff', 'Net cash from financing activities', s.financing, 'Financing', `$${money(t.stockIssued)} + $${money(t.borrowing)} − $${money(t.principalRepaid)} − $${money(t.dividends)} = $${money(s.financing)}.`);
  field('change', 'Net increase / decrease in cash', s.change, 'Reconciliation', `$${money(s.operating)} ${signed(s.investing)} ${signed(s.financing)} = $${money(s.change)}. A decrease must be entered as a negative amount.`);
  field('begin', 'Cash at beginning of year', o.cash, 'Reconciliation', `Use the prior-year balance sheet cash of $${money(o.cash)}.`);
  field('end', 'Cash at end of year', e.cash, 'Reconciliation', `$${money(o.cash)} ${signed(s.change)} = $${money(e.cash)}, equal to cash on the current-year balance sheet.`);
  const balanceRows = [
    ['Cash', 'cash'], ['Accounts Receivable', 'ar'], ['Inventory', 'inventory'],
    ['Prepaid Insurance', 'prepaid'], ['Equipment at cost', 'equipment'],
    ['Accumulated Depreciation', 'accumDep', -1]
  ].map(([label, key, sign = 1]) => [label, money(sign * e[key]), money(sign * o[key])]);
  balanceRows.push(['Total assets', money(s.endingAssets), money(s.openingAssets)]);
  for (const [label, key] of [['Accounts Payable to suppliers', 'ap'], ['Accrued Salaries Payable', 'salariesPayable'], ['Long-term Notes Payable', 'debt'], ['Common Stock', 'stock'], ['Retained Earnings', 'retained']]) balanceRows.push([label, money(e[key]), money(o[key])]);
  balanceRows.push(['Total liabilities and stockholders’ equity', money(s.endingFunding), money(s.openingFunding)]);
  return {
    intro: `${company} · Year ended December 31, 2026. Prepare a complete statement of cash flows using the indirect method and U.S. GAAP classifications. All amounts are in dollars. Enter deductions and cash outflows as negative amounts or in parentheses.`,
    facts: [
      {title: 'Income statement', headers: ['Account', '2026 ($)'], rows: [
        ['Sales revenue', money(t.sales)], ['Cost of goods sold', money(-t.cogs)],
        ['Operating expenses, including depreciation', money(-t.operatingExpenses)],
        [t.gain >= 0 ? 'Gain on sale of equipment' : 'Loss on sale of equipment', money(t.gain)],
        ['Interest expense', money(-t.interest)], ['Income tax expense', money(-t.taxes)], ['Net income', money(t.netIncome)]
      ]},
      {title: 'Comparative balance sheets', headers: ['Account', '2026 ($)', '2025 ($)'], rows: balanceRows}
    ],
    notes: [
      `Depreciation expense of $${money(t.depreciation)} is included in operating expenses.`,
      `Equipment costing $${money(t.equipmentSoldCost)}, with accumulated depreciation of $${money(t.soldAccumDep)}, was sold for $${money(t.saleProceeds)} cash.`,
      `Equipment was purchased for $${money(t.equipmentBought)} cash.`,
      `The company issued common stock for $${money(t.stockIssued)} cash and borrowed $${money(t.borrowing)} by signing a long-term note.`,
      `The company repaid $${money(t.principalRepaid)} of note principal and paid $${money(t.dividends)} in cash dividends.`,
      'There were no other equipment, borrowing, stock, or dividend transactions and no noncash investing or financing transactions. Interest and income taxes were paid as incurred. All notes are long-term.'
    ],
    fields,
    hints: [
      'Begin with net income. Reverse noncash expenses and equipment gains/losses, then adjust for operating working capital. Put equipment cash flows in investing and owner/debt cash flows in financing.',
      'CFO = net income + depreciation − gain (or + loss) − increases in operating current assets + increases in operating current liabilities. Reverse those signs for decreases. Then add CFO, CFI, and CFF to beginning cash.'
    ],
    solution: `Operating cash flow is $${money(s.operating)}; investing cash flow is $${money(s.investing)}; financing cash flow is $${money(s.financing)}. Their sum is a net ${s.change >= 0 ? 'increase' : 'decrease'} of $${money(Math.abs(s.change))}. Beginning cash of $${money(o.cash)} reconciles to ending cash of $${money(e.cash)}. Interest and income taxes stay in operating activities under the course's U.S. GAAP assumptions.`,
    support: [
      {label: 'Book value of equipment sold', answer: t.bookValue, explain: `$${money(t.equipmentSoldCost)} − $${money(t.soldAccumDep)} = $${money(t.bookValue)}.`},
      {label: 'Gain / (loss) on equipment sale', answer: t.gain, explain: `Cash proceeds $${money(t.saleProceeds)} − book value $${money(t.bookValue)} = $${money(t.gain)}.`},
      {label: 'Reconciled ending Notes Payable', answer: e.debt, explain: `$${money(o.debt)} + borrowing $${money(t.borrowing)} − principal repayments $${money(t.principalRepaid)} = $${money(e.debt)}.`},
      {label: 'Reconciled ending Retained Earnings', answer: e.retained, explain: `$${money(o.retained)} + net income $${money(t.netIncome)} − dividends $${money(t.dividends)} = $${money(e.retained)}.`},
      {label: 'Reconciled ending equipment cost', answer: e.equipment, explain: `$${money(o.equipment)} + purchases $${money(t.equipmentBought)} − disposed cost $${money(t.equipmentSoldCost)} = $${money(e.equipment)}.`},
      {label: 'Reconciled ending Accumulated Depreciation', answer: e.accumDep, explain: `$${money(o.accumDep)} + depreciation $${money(t.depreciation)} − accumulated depreciation removed $${money(t.soldAccumDep)} = $${money(e.accumDep)}.`}
    ],
    audit: scenario
  };
}

function parseNumber(raw){let s=String(raw??'').trim();if(!s)return null;let par=s.startsWith('(')&&s.endsWith(')');if(par)s=s.slice(1,-1).trim();s=s.replace(/[$,\s]/g,'').replace(/%$/,'');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return null;const n=Number(s);if(!Number.isFinite(n)||par&&n<0)return null;return par?-n:n}
function fieldCorrect(field,raw){if(typeof field.answer==='number'){const n=parseNumber(raw);return n!==null&&Math.abs(n-field.answer)<=(field.tolerance??.011)}return String(raw??'').trim().toLowerCase()===String(field.answer).trim().toLowerCase()}
function fieldIssue(r,f,raw){
 if(!String(raw??'').trim())return '— Not answered yet.';
 if(typeof f.answer==='number'&&parseNumber(raw)===null)return '↻ Enter a number, not a formula. Commas, dollars, and parentheses are accepted.';
 if(typeof f.answer==='number'&&f.answer!==0&&Math.abs(parseNumber(raw)+f.answer)<.011)return '↻ The magnitude matches, but the sign is reversed. Check whether this is an addition or a deduction.';
 if(r.ch===13&&f.section==='Operating')return '↻ Reverse noncash gains/expenses. Operating asset changes have the opposite sign; operating liability changes keep their sign.';
 if(r.ch===13&&f.section==='Investing')return '↻ Use the full cash proceeds for a sale, not book value or the gain. Equipment purchases are outflows.';
 if(r.ch===16&&/overhead|job/i.test(r.topic+' '+r.title))return '↻ A job receives applied overhead (rate × its actual activity). Actual overhead is recorded separately.';
 if(r.ch===22&&/budget/i.test(r.topic))return '↻ For production or purchases, add the desired ending inventory and subtract beginning inventory. Carry unrounded figures forward.';
 if(r.ch===20&&/break|target/i.test(r.topic))return '↻ Use unit contribution margin for units and the contribution margin ratio for dollars. Round required units upward.';
 return '↻ Not quite. Check the setup, units, sign, and rounding. Try a hint if you need a nudge.';
}
function gradeJournal(record){const j=record.p.journal;if(!j)return true;const actual=new Map();let valid=true,used=0;for(const row of record.journal){if(!row)continue;const has=!!(row.account||String(row.debit??'').trim()||String(row.credit??'').trim());if(!has)continue;used++;const debit=String(row.debit??'').trim()?parseNumber(row.debit):0,credit=String(row.credit??'').trim()?parseNumber(row.credit):0;if(!row.account||debit===null||credit===null||debit<0||credit<0||debit>0&&credit>0){valid=false;continue}const a=actual.get(row.account)||[0,0];a[0]+=debit;a[1]+=credit;actual.set(row.account,a)}const expected=new Map();for(const row of j.expected){const a=expected.get(row.account)||[0,0];a[0]+=row.debit||0;a[1]+=row.credit||0;expected.set(row.account,a)}if(!valid||!used||actual.size!==expected.size)return false;for(const [key,v] of expected){const a=actual.get(key);if(!a||Math.abs(a[0]-v[0])>.011||Math.abs(a[1]-v[1])>.011)return false}return true}

function setup(){return header('Your focus. Your pace.','Build a session around the chapters and problem types you want to practice.')+`<section class="panel">${filtersMarkup()}<div class="filters"><label><span class="field-label">Practice mode</span><select id="mode"><option value="guided"${attr(state.mode,'guided')}>Guided practice</option><option value="quiz"${attr(state.mode,'quiz')}>Quiz · feedback after submission</option></select></label><label><span class="field-label">Session length</span><select id="count">${['5','10','20','continuous'].map(n=>`<option value="${n}"${attr(state.count,n)}>${n==='continuous'?'Continuous (guided only)':n+' problems'}</option>`).join('')}</select></label></div><div class="row spread"><span class="muted" id="match-count">${filtered().length} matching problem templates</span>${button('Start session →','start','primary')}</div></section>${state.session?`<section class="panel row spread"><div><h3 style="margin:0">Your saved session is waiting</h3><small>Question ${state.session.index+1} of ${state.session.queue.length}</small></div>${button('Resume session','resume')}</section>`:''}<p class="bottom-note">Quiz mode hides hints, grading, and solutions until you submit the entire session. Chapter 13 remains in its own cash-flow lab.</p>`}
function listItems(items){return items.map(t=>`<article class="library-item"><div><span class="badge">CH. ${t.ch} · ${esc(t.type)}${t.optional?' · OPTIONAL':''}</span><h3>${esc(t.title)}</h3><small>${esc(t.topic)} · ${esc(t.difficulty)}</small></div>${button('Practice →','pick','small',`data-id="${t.id}"`)}</article>`).join('')}
function library(){return header('A problem for every sticking point.','Find a specific skill, then practice it with fresh numbers.','QUESTION LIBRARY')+`<section class="panel">${filtersMarkup(true)}<span id="match-count" class="muted">${filtered().length} matching templates</span></section><div class="library-list" id="library-results">${listItems(filtered())||'<div class="empty">No matches. Try widening your filters.</div>'}</div><div class="section-head"><h2>Bookmarked problems</h2><span class="pill">${state.bookmarks.length} SAVED</span></div><div class="library-list">${state.bookmarks.map(b=>`<article class="library-item"><div><span class="badge">CH. ${b.ch} · SAME NUMBERS, READY TO REVISIT</span><h3>${esc(b.title)}</h3><small>Variant ${b.seed.toString(36).toUpperCase()}</small></div><div class="row">${button('Open','bookmark-open','small',`data-uid="${b.uid}"`)}${button('Remove','bookmark-remove','small ghost',`data-uid="${b.uid}"`)}</div></article>`).join('')||'<p class="muted">Use “Bookmark” inside any problem to save that exact scenario.</p>'}</div>`}
function dataPanel(r){return `<aside class="panel source-panel"><div class="eyebrow">THE SCENARIO</div><p style="margin-top:14px">${esc(r.p.intro)}</p>${r.p.facts.map(f=>`<section><h3>${esc(f.title)}</h3><div class="table-wrap"><table><thead><tr>${f.headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${f.rows.map(row=>`<tr>${row.map(v=>`<td>${typeof v==='number'?money(v):esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`).join('')}${r.p.notes?.length?`<h3>Additional information</h3><ol class="notes">${r.p.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ol>`:''}<div class="footer-source muted">Aligned to: ${esc(r.source)}<br>Original practice variant · ${r.seed.toString(36).toUpperCase()}</div></aside>`}
function fieldMarkup(r,f){const feedback=r.feedback&&Object.hasOwn(r.feedback,f.id)?r.feedback[f.id]:null;const val=r.answers[f.id]??'';const unit=f.unit|| (typeof f.answer==='number'?'number':'choose one');return `<div class="answer-row ${feedback===true?'ok':feedback===false?'bad':''}"><label for="answer-${esc(f.id)}">${esc(f.label)}<span class="unit">${esc(unit)}${typeof f.answer==='number'&&f.unit!=='units'?' · 2 decimals unless stated':''}</span></label>${f.choices?`<select id="answer-${esc(f.id)}" data-answer="${esc(f.id)}"><option value="">Choose an answer</option>${f.choices.map(c=>`<option value="${esc(c)}"${attr(val,c)}>${esc(c)}</option>`).join('')}</select>`:`<input class="numeric" id="answer-${esc(f.id)}" data-answer="${esc(f.id)}" inputmode="decimal" autocomplete="off" placeholder="—" value="${esc(val)}">`}${feedback!==null?`<div class="answer-feedback ${feedback?'correct':'incorrect'}">${feedback?'✓ Correct':esc(fieldIssue(r,f,val))}</div>`:''}</div>`}
function journalMarkup(r){const j=r.p.journal;return `<div class="journal"><p style="font-size:12px">Select accounts and enter debits or credits. Leave unused rows blank. Enter positive amounts; the column determines the side. Rows may appear in any order.</p><div class="table-wrap"><table><thead><tr><th>Account</th><th>Debit ($)</th><th>Credit ($)</th></tr></thead><tbody>${Array.from({length:j.rows},(_,i)=>{const row=r.journal[i]||{};return `<tr><td><select data-jrow="${i}" data-jfield="account" aria-label="Row ${i+1} account"><option value="">Choose account</option>${j.accounts.map(a=>`<option${attr(row.account,a)}>${esc(a)}</option>`).join('')}</select></td><td><input inputmode="decimal" data-jrow="${i}" data-jfield="debit" value="${esc(row.debit||'')}" aria-label="Row ${i+1} debit"></td><td><input inputmode="decimal" data-jrow="${i}" data-jfield="credit" value="${esc(row.credit||'')}" aria-label="Row ${i+1} credit"></td></tr>`}).join('')}</tbody></table></div>${r.feedback?.journal!==undefined?`<div class="notice ${r.feedback.journal?'success':''}">${r.feedback.journal?'✓ Correct journal entry.':'↻ Check the accounts, debit/credit sides, and amounts. Balanced totals alone are not enough.'}</div>`:''}</div>`}
function solutionMarkup(r){return `<div class="solution"><h3>Worked solution</h3><p>${esc(r.p.solution)}</p>${r.p.fields.length?`<ol>${r.p.fields.map(f=>`<li><strong>${esc(f.label)}: ${typeof f.answer==='number'?money(Math.round(f.answer*100)/100):esc(f.answer)} ${esc(f.unit||'')}</strong><br>${esc(f.explain)}</li>`).join('')}</ol>`:''}${r.p.journal?`<p>${esc(r.p.journal.explain)}</p><div class="table-wrap"><table><thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${r.p.journal.expected.map(j=>`<tr><td>${esc(j.account)}</td><td>${j.debit?money(j.debit):'—'}</td><td>${j.credit?money(j.credit):'—'}</td></tr>`).join('')}</tbody></table></div>`:''}</div>`}
function worksheet(r){const exam=isExam(),canHelp=!exam||released();const sections=[...new Set(r.p.fields.map(f=>f.section||'Your answers'))];const result=r.feedback?Object.values(r.feedback):[];return `<section class="panel"><div class="row spread"><div class="eyebrow">YOUR WORKSHEET</div>${button(state.bookmarks.some(b=>b.uid===r.uid)?'★ Bookmarked':'☆ Bookmark','bookmark','small ghost')}</div><p style="font-size:12px;margin:14px 0 8px">Enter your answers below. Use a minus sign or parentheses for deductions. Percent fields use percentage points (e.g. 25 for 25%). Round money and ratios to 2 decimals; required units round up where stated.</p>${result.length?`<div class="notice ${result.every(Boolean)?'success':''}" role="status">${result.every(Boolean)?'✓ All checked answers correct.':`${result.filter(Boolean).length} of ${result.length} checked answers correct.`}${r.everAssisted?' · Assisted practice':''}</div>`:''}${sections.map(sec=>`<section class="answer-section"><h3>${esc(sec)}</h3>${r.p.fields.filter(f=>(f.section||'Your answers')===sec).map(f=>fieldMarkup(r,f)).join('')}${r.ch===13&&!exam?button('Check '+esc(sec),'section-check','small ghost section-check',`data-section="${esc(sec)}"`):''}</section>`).join('')}${r.p.journal?journalMarkup(r):''}${r.p.support?.length?`<details class="hint"><summary>Optional scratch work</summary><p>Use this space for book value, gain/loss, and debt/retained-earnings reconciliations. Scratch work is not scored.</p>${r.p.support.map((s,i)=>`<label class="field-label" for="support-${i}">${esc(s.label)}</label><input id="support-${i}" data-answer="support-${i}" inputmode="decimal" value="${esc(r.answers['support-'+i]||'')}" style="margin-bottom:12px">`).join('')}${r.revealed?r.p.support.map(s=>`<p><strong>${esc(s.label)}: ${money(s.answer)}</strong><br>${esc(s.explain)}</p>`).join(''):''}</details>`:''}<div class="actions">${(!exam||released())?button(r.ch===13?'Submit entire statement':'Check answer','check','primary'):r.ch===13?button('Submit entire statement','check','primary'):''}${canHelp?button('Try again','retry','ghost'):''}${canHelp?button(r.hint>=2?'Hints shown':r.hint?'Show setup hint':'Get a hint','hint','ghost',r.hint>=2?'disabled':''):''}${canHelp?button(r.revealed?'Hide solution':'Show worked solution','solution','ghost'):''}</div>${r.hint&&canHelp?`<div class="hint"><h3>${r.hint===1?'A nudge in the right direction':'Concept + setup'}</h3>${r.p.hints.slice(0,r.hint).map((h,i)=>`<p><strong>${i+1}.</strong> ${esc(h)}</p>`).join('')}</div>`:''}${r.revealed&&canHelp?solutionMarkup(r):''}${exam&&!released()?'<p class="bottom-note">Quiz mode: answers are saved as you type. Feedback and solutions unlock after submission.</p>':''}</section>`}
function practice(){if(!state.session||state.showSetup)return setup();const s=state.session,r=active();if(!r)return setup();const done=s.queue.filter(q=>q.feedback&&Object.values(q.feedback).every(Boolean)).length;return `<div class="workspace-head"><div class="row spread"><div class="eyebrow">${s.mode==='quiz'?'QUIZ MODE':'GUIDED PRACTICE'} · CHAPTER ${r.ch}</div>${button('Set up another session','setup','small ghost')}</div><h1>${esc(r.title)}</h1><div class="row spread"><span class="muted">${esc(r.topic)} · Problem ${s.index+1}${s.continuous?' · continuous practice':' of '+s.queue.length}</span><span class="pill">${done} COMPLETE</span></div><div class="progress-track"><span style="width:${100*(s.index+1)/s.queue.length}%"></span></div>${s.mode==='quiz'?`<div class="row quiz-nav">${s.queue.map((q,i)=>button(String(i+1),'question-index','small '+(i===s.index?'current':'')+(Object.keys(q.answers).length||q.journal.some(Boolean)?' done':''),`data-index="${i}" aria-label="Question ${i+1}"`)).join('')}${!s.submitted?button('Submit quiz','submit-quiz','primary small'):button('View quiz results','quiz-results','small')}</div>`:''}</div>${s.submitted&&state.showResults?quizResults():''}<div class="workspace">${dataPanel(r)}<div>${worksheet(r)}<div class="row spread">${button('← Previous','previous','ghost',s.index===0?'disabled':'')}${s.mode!=='quiz'?button('Generate similar','similar','ghost'):''}${button(s.index===s.queue.length-1&&!s.continuous?'Finish session →':'Next problem →','next','primary')}</div></div></div>`}
function quizResults(){const s=state.session;let correct=0,total=0;s.queue.forEach(r=>{const g=r.submittedResults||grade(r);correct+=Object.values(g).filter(Boolean).length;total+=Object.keys(g).length});return `<section class="panel"><div class="eyebrow">QUIZ RESULTS</div><div class="result-score">${correct} / ${total}</div><p>Answer parts correct at submission. Use the numbered buttons to review each problem and its worked solution.</p>${s.queue.map((r,i)=>{const g=r.submittedResults||grade(r);return `<div class="row spread" style="margin:10px 0"><span>${i+1}. ${esc(r.title)}</span><strong>${Object.values(g).filter(Boolean).length}/${Object.keys(g).length}</strong></div>`}).join('')}</section>`}
function cash(){if(!state.cash)return header('Follow the flow. Finish the statement.','A complete Chapter 13 problem, from the comparative balance sheets to the final cash reconciliation.','CASH-FLOW LAB')+`<section class="hero"><div><div class="eyebrow">ONE SCENARIO. THE WHOLE PICTURE.</div><h1>Your full-problem<br>practice space.</h1><p>Work through operating, investing, and financing activities using the indirect method. Each new scenario includes coherent statements and a step-by-step answer key.</p>${button('Generate full cash-flow problem →','new-cash','primary')}</div><div class="hero-art" aria-hidden="true"><div class="orbit"><span>⇄</span></div></div></section><section class="stats"><div class="stat"><span class="muted">01 · Analyze</span><strong>Read</strong><small>Income statement + two balance sheets</small></div><div class="stat"><span class="muted">02 · Prepare</span><strong>Solve</strong><small>Operating, investing, financing</small></div><div class="stat"><span class="muted">03 · Reconcile</span><strong>Check</strong><small>Beginning cash to ending cash</small></div></section><p>Based on your Chapter 13 review’s full problem. No short cash-flow questions are mixed into regular practice.</p>`;const r=state.cash;return `<div class="workspace-head"><div class="eyebrow">CHAPTER 13 · CASH-FLOW LAB</div><h1>A complete statement. One step at a time.</h1><div class="row spread"><span class="muted">Indirect method · U.S. GAAP · all amounts in dollars</span><div class="row"><label class="chip"><input type="checkbox" id="cash-exam" ${r.exam?'checked':''}><span>Exam mode</span></label>${button('Generate full cash-flow problem','new-cash','small')}</div></div>${r.exam?'<p class="bottom-note">Exam mode hides section checks, hints, and solutions until you submit the complete statement.</p>':''}</div><div class="workspace">${dataPanel(r)}<div>${worksheet(r)}${button('Generate another complete scenario →','new-cash','primary')}</div></div>`}
function mistakes(){const missed=state.stats.filter(s=>s.firstCorrect<s.total&&!s.completed);return header('Turn the tricky parts into strengths.','Revisit exact scenarios you have not yet completed correctly, or get fresh numbers for the same skill.','REVIEW MISTAKES')+(missed.length?`<div class="library-list">${missed.map(s=>`<article class="library-item"><div><span class="badge">CH. ${s.ch} · ${s.assisted?'ASSISTED':'FIRST ATTEMPT'}</span><h3>${esc(s.title)}</h3><small>${s.firstCorrect}/${s.total} parts correct on first check · ${esc(s.topic)}</small></div><div class="row">${button('Retry original','missed-open','small',`data-uid="${s.uid}"`)}${button('New variant','missed-similar','small ghost',`data-id="${s.id}"`)}</div></article>`).join('')}</div>`:`<div class="empty"><div class="eyebrow">ROOM TO GROW</div><h2>${state.stats.length?'You’ve worked through your mistakes.':'Your review list starts here.'}</h2><p>Unfinished problems with missed answers will appear here automatically. A fully correct submission clears the problem from this list.</p>${button('Start practicing','setup','primary')}</div>`)}
function progress(){const s=summary(),eligible=state.stats.filter(s=>!s.assisted),topics=[...new Set(state.stats.map(s=>'Ch. '+s.ch+' · '+s.topic))];const assisted=state.stats.filter(s=>s.assisted).length;return header('See what’s getting stronger.','Honest feedback on your first attempts, without counting revealed answers as mastery.','YOUR PROGRESS')+`<section class="stats"><div class="stat"><span class="muted">First-attempt accuracy</span><strong>${s.accuracy}</strong><small>${s.correct} / ${s.total} unassisted answer parts</small></div><div class="stat"><span class="muted">Completed problems</span><strong>${s.completed}</strong><small>Fully correct submissions, including retries</small></div><div class="stat"><span class="muted">Assisted attempts</span><strong>${assisted}</strong><small>Excluded from first-attempt accuracy</small></div></section><section class="panel"><h2>Accuracy by chapter</h2><div class="bars">${[14,15,16,20,22,13].map(ch=>{const a=eligible.filter(s=>s.ch===ch),total=a.reduce((n,s)=>n+s.total,0),correct=a.reduce((n,s)=>n+s.firstCorrect,0),pct=total?Math.round(100*correct/total):0;return `<div class="bar-row"><span>Chapter ${ch} · ${CHAPTERS[ch]?.title||'Cash-flow lab'}</span><small>${total?pct+'%':'No checks'}</small><div class="progress-track"><span style="width:${pct}%"></span></div></div>`}).join('')}</div></section>${topics.length?`<section class="panel"><h2>Topic detail</h2><div class="table-wrap"><table class="results-table"><thead><tr><th>Topic</th><th>First attempt</th><th>Completed</th></tr></thead><tbody>${topics.map(t=>{const a=state.stats.filter(s=>'Ch. '+s.ch+' · '+s.topic===t),u=a.filter(s=>!s.assisted),total=u.reduce((n,s)=>n+s.total,0),correct=u.reduce((n,s)=>n+s.firstCorrect,0);return `<tr><td>${esc(t)}</td><td>${total?correct+' / '+total:'Assisted only'}</td><td>${a.filter(s=>s.completed).length}</td></tr>`}).join('')}</tbody></table></div></section>`:''}${state.stats.some(s=>s.ch===13)?`<section class="panel"><h2>Cash-flow section performance</h2><p>${state.stats.filter(s=>s.ch===13).length} scenarios checked. First unassisted check of each section:</p><div class="bars">${['Operating','Investing','Financing','Reconciliation'].map(sec=>{const a=state.stats.filter(s=>s.ch===13&&s.sections[sec]&&!s.sections[sec].assisted).map(s=>s.sections[sec]),total=a.reduce((n,s)=>n+s.total,0),correct=a.reduce((n,s)=>n+s.correct,0);return `<div class="bar-row"><span>${sec}</span><small>${total?Math.round(100*correct/total)+'%':'—'}</small><div class="progress-track"><span style="width:${total?100*correct/total:0}%"></span></div></div>`}).join('')}</div></section>`:''}${coverage()}<section class="panel row spread"><div><h3 style="margin:0">Your data, on this browser</h3><small>No account, syncing, or uploads. Local-file and GitHub Pages progress may be stored separately.</small></div>${button('Reset progress','reset','danger ghost')}</section>`}
function render(){const pages={home,practice,library,mistakes,cash,progress};if(!pages[state.page])state.page='home';$('#app').innerHTML='<div class="page">'+pages[state.page]()+'</div>';$$('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===state.page);if(b.dataset.nav===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});storageNotice()}
function handleAnswer(el){const r=active();if(!r)return;if(el.dataset.answer){r.answers[el.dataset.answer]=el.value;if(r.feedback)delete r.feedback[el.dataset.answer];el.closest('.answer-row')?.classList.remove('ok','bad');el.closest('.answer-row')?.querySelector('.answer-feedback')?.remove()}if(el.dataset.jrow!==undefined){const i=+el.dataset.jrow;r.journal[i]??={};r.journal[i][el.dataset.jfield]=el.value;if(r.feedback)delete r.feedback.journal}const panel=el.closest('.panel');panel?.querySelector('.notice[role="status"]')?.remove();save()}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.answer||el.dataset.jrow!==undefined)handleAnswer(el);if(el.id==='search'){state.filters.search=el.value;save();if($('#library-results'))$('#library-results').innerHTML=listItems(filtered())||'<div class="empty">No matches. Try widening your filters.</div>';$('#match-count').textContent=filtered().length+' matching problem templates'}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.answer||el.dataset.jrow!==undefined)handleAnswer(el);if(el.dataset.filterCh){const ch=+el.dataset.filterCh;state.filters.chapters=el.checked?[...state.filters.chapters,ch]:state.filters.chapters.filter(x=>x!==ch);state.filters.topic='';save();render()}if(el.dataset.filter){state.filters[el.dataset.filter]=el.value;save();render()}if(el.id==='optional'){state.filters.optional=el.checked;state.filters.topic='';save();render()}if(el.id==='mode'||el.id==='count'){state[el.id]=el.value;save()}if(el.id==='cash-exam'){const r=state.cash;r.exam=el.checked;if(r.exam){r.feedback=null;r.revealed=false;r.hint=0;r.submitted=false}save();render()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){if(b.dataset.nav==='practice')state.showSetup=false;go(b.dataset.nav);return}const a=b.dataset.action,r=active(),s=state.session;if(!a)return;
if(['library','cash','progress'].includes(a)){go(a);return}
if(a==='setup'){state.showSetup=true;go('practice')}
if(a==='resume'){state.showSetup=false;go('practice')}
if(a==='start'){state.showSetup=false;startSession()}
if(a==='chapter'){state.filters={...defaults().filters,chapters:[+b.dataset.ch]};state.showSetup=true;go('practice')}
if(a==='pick'){state.mode='guided';state.showSetup=false;startSession(b.dataset.id)}
if(a==='check')check();if(a==='section-check')check(b.dataset.section);
if(a==='bookmark')toggleBookmark();
if(a==='bookmark-open')loadBookmark(b.dataset.uid);
if(a==='bookmark-remove'){state.bookmarks=state.bookmarks.filter(x=>x.uid!==b.dataset.uid);save();render()}
if(a==='hint'&&r){r.hint=Math.min(2,r.hint+1);r.everAssisted=true;save();render()}
if(a==='solution'&&r){r.revealed=!r.revealed;if(r.revealed)r.everAssisted=true;save();render()}
if(a==='retry'&&r){r.feedback=null;r.revealed=false;r.hint=0;r.answers={};r.journal=[];save();render();toast('Same scenario, a fresh worksheet. Your first attempt stays recorded.')}
if(a==='similar'&&r){const t=BANK.find(t=>t.id===r.id);s.queue[s.index]=makeRecord(t);save();render();window.scrollTo({top:0,behavior:'instant'})}
if(a==='previous'&&s&&s.index){s.index--;save();render();window.scrollTo({top:0,behavior:'instant'})}
if(a==='next'&&s){if(s.index<s.queue.length-1){s.index++;save();render()}else if(s.continuous){const t=BANK.find(t=>t.id===s.pool[Math.floor(Math.random()*s.pool.length)]);s.queue.push(makeRecord(t));s.index++;save();render()}else if(s.mode==='quiz'&&!s.submitted){toast('Submit your quiz to see your results.');return}else{go('progress')}window.scrollTo({top:0,behavior:'instant'})}
if(a==='question-index'){s.index=+b.dataset.index;save();render()}
if(a==='submit-quiz'){state.showResults=true;submitQuiz()}
if(a==='quiz-results'){state.showResults=!state.showResults;render()}
if(a==='new-cash'){state.cash=makeCashRecord();save();render();window.scrollTo({top:0,behavior:'instant'})}
if(a==='missed-open'){const stat=state.stats.find(x=>x.uid===b.dataset.uid);const rec=JSON.parse(JSON.stringify(stat.snapshot));rec.feedback=null;rec.revealed=false;rec.hint=0;if(rec.ch===13){state.cash=rec;state.cash.exam=false;go('cash')}else{state.showSetup=false;state.session={mode:'guided',queue:[rec],index:0,submitted:false,pool:[rec.id]};go('practice')}}
if(a==='missed-similar'){if(b.dataset.id==='cashflow'){state.cash=makeCashRecord();go('cash')}else{state.mode='guided';state.showSetup=false;startSession(b.dataset.id)}}
if(a==='reset')$('#reset-dialog').showModal();if(a==='cancel-reset')$('#reset-dialog').close();if(a==='confirm-reset'){state=defaults();save();$('#reset-dialog').close();render();toast('Progress reset. Ready for a fresh start.')}
});
render();
/* Public, read-only testing surface for local QA. */
globalThis.LedgerTest={parseNumber,fieldCorrect,gradeJournal,rngFor,BANK,makeCashflow,grade};
